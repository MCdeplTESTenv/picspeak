<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="PicSpeak – strumento gratuito di Comunicazione Aumentativa Alternativa">
  <title>PicSpeak</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Striscia frase: i simboli scelti formano la frase -->
  <header class="sentence-bar">
    <ol class="sentence-strip" id="sentence-strip" aria-live="polite"></ol>
    <div class="sentence-actions">
      <button type="button" class="action-btn action-speak" id="btn-speak">
        <span class="action-icon" aria-hidden="true">🔊</span>
      </button>
      <button type="button" class="action-btn" id="btn-backspace">
        <span class="action-icon" aria-hidden="true">⌫</span>
      </button>
      <button type="button" class="action-btn" id="btn-clear">
        <span class="action-icon" aria-hidden="true">✕</span>
      </button>
    </div>
  </header>

  <!-- Barra di navigazione tra le pagine -->
  <nav class="page-nav">
    <button type="button" class="nav-btn" id="btn-home">
      <span class="action-icon" aria-hidden="true">🏠</span>
    </button>
    <h1 class="page-title" id="page-title"></h1>
  </nav>

  <!-- Griglia dei simboli della pagina corrente -->
  <main class="symbol-grid" id="symbol-grid"></main>

  <noscript>PicSpeak ha bisogno di JavaScript attivo per funzionare.</noscript>

  <!-- Script classici (nessun build, funziona anche aprendo il file con doppio clic) -->
  <script src="js/i18n.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
